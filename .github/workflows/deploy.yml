name: Deploy Vite TypeScript Site to GitHub Pages

on:
  push:
    branches: [main] # Runs every time you commit to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build Site
        run: npm run build # This executes your "tsc -b && vite build" script

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite outputs production files into the 'dist' folder

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
